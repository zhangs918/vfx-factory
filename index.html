<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFX Factory — Quarks / WebGL</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <aside id="hud">
        <div class="brand">VFX Factory</div>
        <p class="hint">WebGL · three.quarks · Unity 导出</p>
        <label>
          Effect
          <select id="effectSelect"></select>
        </label>
        <div class="btn-row">
          <button id="playBtn" type="button">Play</button>
          <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
          <button id="resetCameraBtn" type="button">Reset View</button>
        </div>
        <fieldset id="tweakPanel" class="tweak-panel">
          <legend>Live Tweaks</legend>
          <label>
            Tint
            <input id="tweakTint" type="color" value="#ffffff" />
          </label>
          <label>
            <span class="tweak-label-row">HDR <span id="tweakHdrVal" class="tweak-val">1.00</span></span>
            <input id="tweakHdr" type="range" min="0.1" max="4" step="0.05" value="1" />
          </label>
          <label>
            <span class="tweak-label-row">Opacity <span id="tweakOpacityVal" class="tweak-val">1.00</span></span>
            <input id="tweakOpacity" type="range" min="0" max="2" step="0.05" value="1" />
          </label>
          <label>
            <span class="tweak-label-row">Scale <span id="tweakScaleVal" class="tweak-val">1.00</span></span>
            <input id="tweakScale" type="range" min="0.25" max="3" step="0.05" value="1" />
          </label>
          <label>
            <span class="tweak-label-row">Speed <span id="tweakSpeedVal" class="tweak-val">1.00</span></span>
            <input id="tweakSpeed" type="range" min="0.1" max="2" step="0.05" value="1" />
          </label>
          <button id="tweakResetBtn" type="button">Reset Tweaks</button>
        </fieldset>
        <p class="tip">Space 播放 · P 暂停 · R 重置视角</p>
        <div id="status">Booting WebGL…</div>
        <pre id="exportHint" class="tip"></pre>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
